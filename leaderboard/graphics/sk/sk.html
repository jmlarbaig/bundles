<body style="background:#0d0d1a;">
	<div class="cis-wrap">
		<!-- ===== TOP BAR ===== -->
		<header class="topbar">
			<div class="topbar-row">
				<div class="brand">
					<!-- Competition Corner Logo — SVG recreation of double chevron + C -->
					<div
						style="width:40px;height:40px;background:#111;border-radius:8px;border:1px solid #2a2a3a;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
						<div style="width:24px;height:24px;display:flex;align-items:center;justify-content:center;">
							<img src="../assets/images/logo.png" style="height:100%;" alt="Competition Corner Live">
						</div>
					</div>
					<div class="brand-txt">
						<div class="name">Competition Corner Live</div>
						<div class="sub">Device Diagnostics</div>
					</div>
				</div>
				<div class="counter" id="counter">
					<div class="ring">
						<svg width="46" height="46" viewBox="0 0 46 46">
							<circle class="bg-arc" cx="23" cy="23" r="19" fill="none" stroke-width="5" />
							<circle class="fg-arc" id="ringArc" cx="23" cy="23" r="19" fill="none" stroke-width="5"
								stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="35.8" />
						</svg>
					</div>
					<div>
						<div class="nums"><span id="active-count">8</span><span class="tot" id="athletes-count"></span>
						</div>
						<div class="lbl">Lanes Live · <b id="devsum">15/17 devices</b></div>
					</div>
				</div>
			</div>
			<div class="tiles">
				<div class="tile">
					<div class="k">Current Workout</div>
					<div class="v workout" id="workoutName"></div>
				</div>
				<div class="tile">
					<div class="k">Heat</div>
					<div class="v" id="heatNumber"></div>
				</div>
				<div class="tile">
					<div class="k">Time of Day</div>
					<div class="v" id="timeOfDay"></div>
				</div>
				<div class="tile">
					<div class="k"><span class="live-dot"></span>Workout Clock</div>
					<div class="v clock-v chrono"><span class="time"></span><span class="cap"></span>
					</div>
				</div>
			</div>
		</header>

		<br>

		<section class="grid">
			<div class="tablebar">
				<span class="tbtitle">Mobiles Alone</span>
				<button id="toggleAllIssues" onclick="toggleAllIssues()">Expand all</button>
			</div>
			<div class="ath" id="ath0">
				<div class="kids" id="kids"></div>
			</div>
		</section>

		<br>

		<!-- ===== ACTION / ALERT BAR ===== -->
		<div id="alertbar" class="alertbar"></div>

		<br>

		<section class="grid">
			<div class="tablebar">
				<span class="tbtitle">Lanes &amp; Devices</span>
				<button id="toggleAll" onclick="toggleAllLanes()">Expand all</button>
			</div>
			<div class="leaderboards" id="leaderboards"></div>
		</section>


		<!-- The Modal -->
		<div id="myModal-Confirm" class="modal-confirm">
			<!-- Modal content -->
			<div class="modal-confirm-content">
				<span class="close">&times;</span>
				<h3>BE CAREFUL</h3>
				<p id="textConfirmation"></p>
				<button class="danger" onclick="closeModal()">NO</button>
				<button class="success" onclick="confirmChoice()">YES</button>
			</div>
		</div>

		<div class="foot">
			<span class="legend"><b style="letter-spacing:.18em;color:var(--muted-2)">BATTERY</b>
				<span class="grp2"><i style="background:var(--bad)"></i><b>&lt;30%</b></span>
				<span class="grp2"><i style="background:var(--orange)"></i><b>30–69%</b></span>
				<span class="grp2"><i style="background:var(--ok)"></i><b>70%+</b></span></span>
			<span class="upd">LAST PING · <span id="lastUpd"></span></span>
		</div>
	</div>


	<script src="js/modal.js" type="text/javascript"></script>
