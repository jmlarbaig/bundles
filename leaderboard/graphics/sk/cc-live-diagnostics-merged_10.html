<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Competition Corner Live — Device Diagnostics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700&family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e16; --bg-2:#0d1320; --panel:#111827; --panel-2:#0f1623;
    --line:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.12);
    --text:#e9eef6; --muted:#76839c; --muted-2:#5b6781;
    --accent:#38bdf8; --ok:#34d399; --good:#5ed6c0; --warn:#fbbf24; --orange:#fb923c; --bad:#f8556b;
    --finish:#a78bfa;
    --shadow:0 18px 40px -18px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Saira',sans-serif;
    background:
      radial-gradient(1200px 700px at 80% -10%, rgba(56,189,248,.08), transparent 60%),
      radial-gradient(900px 600px at 0% 120%, rgba(52,211,153,.05), transparent 55%),
      linear-gradient(180deg,var(--bg),var(--bg-2));
    background-attachment:fixed; color:var(--text); min-height:100vh; padding:22px;
    -webkit-font-smoothing:antialiased;
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;z-index:0;
    background-image:radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px);background-size:26px 26px;}
  .app{position:relative;z-index:1;max-width:1560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

  /* ---------- TOP BAR ---------- */
  .topbar{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);
    border-radius:16px;box-shadow:var(--shadow);overflow:hidden;}
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 22px}
  .brand{display:flex;align-items:center;gap:18px}
  .brand .logo{height:48px;width:auto;display:block}
  .brand-txt .name{font-size:18px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;line-height:1}
  .brand-txt .sub{font-size:11px;letter-spacing:.32em;color:var(--muted);text-transform:uppercase;margin-top:6px;font-weight:600}

  .counter{display:flex;align-items:center;gap:16px;border:1px solid var(--line-strong);border-radius:12px;
    padding:10px 18px 10px 16px;background:rgba(251,191,36,.06);}
  .counter.ok{background:rgba(52,211,153,.07)}
  .counter .ring{position:relative;width:46px;height:46px;flex:0 0 auto}
  .counter .ring svg{transform:rotate(-90deg)}
  .counter .ring .bg-arc{stroke:rgba(255,255,255,.1)}
  .counter .ring .fg-arc{stroke:var(--warn);transition:stroke-dashoffset .6s ease}
  .counter.ok .ring .fg-arc{stroke:var(--ok)}
  .counter .nums{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;line-height:1}
  .counter .nums .tot{color:var(--muted)}
  .counter .lbl{font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-top:6px;font-weight:600}
  .counter .lbl b{color:var(--warn);font-weight:600}
  .counter.ok .lbl b{color:var(--ok)}

  .tiles{display:grid;grid-template-columns:1.6fr 1fr 1fr 1.1fr;gap:1px;background:var(--line);border-top:1px solid var(--line)}
  .tile{background:linear-gradient(180deg,rgba(255,255,255,.012),transparent);padding:13px 22px}
  .tile .k{font-size:10px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase;font-weight:600}
  .tile .v{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:500;margin-top:7px;line-height:1;color:var(--text)}
  .tile .v.workout{font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:23px;letter-spacing:.02em;text-transform:uppercase}
  .tile .v small{font-size:13px;color:var(--muted);font-weight:400}
  .clock-v{display:flex;align-items:baseline;gap:9px}
  .clock-v .cap{font-size:12px;color:var(--muted);letter-spacing:.04em}
  #workoutClock.warn{color:var(--warn)} #workoutClock.bad{color:var(--bad)}
  .live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-right:7px;vertical-align:middle;animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(248,85,107,.55)}70%{box-shadow:0 0 0 8px rgba(248,85,107,0)}100%{box-shadow:0 0 0 0 rgba(248,85,107,0)}}

  /* ---------- TABLE ---------- */
  .grid{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);
    border-radius:16px;box-shadow:var(--shadow);overflow:hidden;}
  .tablebar{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:13px 26px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .eqdrop{position:relative;margin-right:auto}
  #eqBtn{display:inline-flex;align-items:center;gap:8px}
  #eqBtn .car{font-size:9px;opacity:.7}
  #eqBtn #eqCount{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--accent)}
  .eqmenu{position:absolute;top:calc(100% + 7px);left:0;z-index:60;min-width:215px;display:none;
    background:var(--panel-2);border:1px solid var(--line-strong);border-radius:11px;box-shadow:var(--shadow);padding:7px}
  .eqmenu.open{display:block}
  .eqitem{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;cursor:pointer;
    border:none;background:transparent;color:var(--muted);font-family:'Saira Condensed',sans-serif;
    font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;text-align:left;transition:background .12s}
  .eqitem:hover{background:rgba(255,255,255,.05)}
  .eqitem .ricon{opacity:.55;width:17px}
  .eqitem .tick{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--muted-2);display:inline-flex;
    align-items:center;justify-content:center;font-size:9px;line-height:1;color:transparent;flex-shrink:0}
  .eqitem.on{color:var(--text)}
  .eqitem.on .ricon{opacity:1}
  .eqitem.on .tick{border-color:var(--accent);background:var(--accent);color:#04121f}
  .tbactions{display:flex;gap:10px}
  .tbactions button.on{background:var(--accent);border-color:var(--accent);color:#04121f}
  .tbtitle{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .tablebar button{font-family:'Saira',sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
    color:var(--text);background:rgba(255,255,255,.04);border:1px solid var(--line-strong);border-radius:8px;padding:7px 15px;cursor:pointer;transition:.15s}
  .tablebar button:hover{background:rgba(255,255,255,.09);border-color:var(--accent);color:#fff}

  .ghead,.row{display:grid;grid-template-columns:134px 76px 92px 104px minmax(110px,150px) 56px 200px minmax(78px,1fr) minmax(104px,1fr);align-items:center;column-gap:12px}
  .ghead{padding:13px 26px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.015)}
  .ghead span{font-size:11px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase;font-weight:600}
  .na{font-family:'IBM Plex Mono',monospace;color:var(--muted-2);font-size:16px}

  .row{padding:0 26px;border-bottom:1px solid var(--line);position:relative;transition:background .2s}
  .row:last-child{border-bottom:none}
  .parent{min-height:66px;cursor:pointer}
  .parent.off{opacity:.6;cursor:default}
  .parent:hover{background:rgba(255,255,255,.025)}

  .lane{display:flex;align-items:center;gap:11px}
  .chev{display:inline-block;width:13px;text-align:center;color:var(--muted);transition:transform .22s;font-size:11px}
  .grp.open .parent .chev{transform:rotate(90deg)}
  .lane .no{font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:600;min-width:34px;line-height:1}
  .dot{width:9px;height:9px;border-radius:50%}
  .pcount{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);background:rgba(255,255,255,.06);
    border:1px solid var(--line-strong);border-radius:20px;padding:2px 9px;letter-spacing:.04em}

  .batt{display:flex;align-items:center;gap:4px}
  .bicon-v{width:14px;height:22px;flex-shrink:0;display:block}
  .bslot{width:11px;height:18px;flex-shrink:0;display:inline-flex;align-items:center}
  .bslot svg{width:11px;height:18px;display:block;animation:boltp 1.6s ease-in-out infinite}
  @keyframes boltp{0%,100%{opacity:1}50%{opacity:.3}}
  .batt .pct{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;min-width:34px;color:var(--muted);margin-left:3px}
  .rollcap{font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);font-weight:600;margin-left:2px}

  .sig{display:flex;align-items:center;gap:10px}
  .bars{display:flex;align-items:flex-end;gap:2.5px;height:16px}
  .bars .b{width:4px;border-radius:1px}
  .sig .val{display:flex;flex-direction:column;gap:2px}
  .sig .dbm{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500}
  .sig .dbm small{font-size:10px;color:var(--muted);margin-left:2px}
  .sig .tier{font-size:9px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}

  .ip{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--text)}
  .ip.muted{color:var(--muted-2);font-family:'Saira',sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
  .cname{font-family:'Saira',sans-serif;font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text)}
  .cname.sub{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.08em}
  .parent.off .cname{color:var(--muted)}

  .link{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .link .code{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--text)}
  .parent.off .link .code{color:var(--bad);letter-spacing:.12em;font-size:12px}
  .badge,.chip{font-size:9px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;padding:3px 7px;border-radius:5px;border:1px solid var(--line-strong)}
  .badge.wifi{color:var(--accent);background:rgba(56,189,248,.08);border-color:rgba(56,189,248,.25)}
  .badge.mobile{color:#c4b5fd;background:rgba(167,139,250,.08);border-color:rgba(167,139,250,.25)}
  .chip.cnt{color:var(--ok);background:rgba(52,211,153,.08);border-color:rgba(52,211,153,.28)}
  .chip.fin{color:var(--finish);background:rgba(167,139,250,.09);border-color:rgba(167,139,250,.3)}

  .repcell{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:4px 6px;transition:background .15s}
  .repcell.flash{background:rgba(52,211,153,.18)}
  @keyframes rowflash{0%,100%{background:transparent}25%{background:rgba(56,189,248,.16)}}
  .row.parent.flash{animation:rowflash 1.1s ease}
  .repcell .rdot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px rgba(52,211,153,.8);animation:rx 1.4s infinite}
  @keyframes rx{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
  .repcell .rep{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600}
  .repcell .arrow{color:var(--ok);font-size:11px}

  .fcell{display:inline-flex;align-items:center;gap:7px;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;letter-spacing:.06em}
  .fcell.armed{color:var(--accent)}
  .fcell.armed .fdot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px rgba(56,189,248,.7);animation:rx 1.6s infinite}
  .fcell.done{color:var(--ok)}
  .fcell .flag{font-size:13px}
  .pact{display:flex;align-items:center;gap:12px}
  .pact .pfin{font-size:13px}

  /* ----- child device rows ----- */
  .grp .kids{display:none}
  .grp.open .kids{display:block}
  .child{min-height:54px;background:rgba(255,255,255,.018)}
  .child::before{background:transparent !important}
  .child:hover{background:rgba(255,255,255,.03)}
  .lane.dev{padding-left:22px;gap:8px}
  .dline{width:13px;height:13px;border-left:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);
    border-bottom-left-radius:5px;margin-right:4px;flex:0 0 auto}
  .dicon{font-size:13px;flex:0 0 auto}
  .dmeta{display:flex;flex-direction:column;gap:2px;min-width:0}
  .dlabel{font-size:11px;font-weight:600;letter-spacing:.04em;white-space:nowrap}
  .ddet{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);font-weight:600}

  .foot{display:flex;justify-content:space-between;align-items:center;padding:2px 8px;font-size:11px;color:var(--muted);letter-spacing:.08em}
  .foot .upd{font-family:'IBM Plex Mono',monospace}

  @media(max-width:1000px){
    .tiles{grid-template-columns:1fr 1fr}.topbar-row{flex-wrap:wrap}
    .ghead,.row{grid-template-columns:104px 54px 70px 84px minmax(90px,120px) 44px minmax(150px,1.4fr) 58px 84px;column-gap:8px}
    .bicon-v{width:12px;height:19px}
  }

  /* ---------- connection-type icon (next to signal) ---------- */
  .sigico{width:22px;height:17px;flex-shrink:0}
  .conn{display:inline-flex;align-items:center;gap:3px;margin-left:9px;font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;vertical-align:middle;white-space:nowrap;flex-shrink:0}
  .conn svg{width:13px;height:13px;display:block}
  .conn.wifi{color:var(--accent)} .conn.lte{color:#c4b5fd}

  /* ---------- workout cells (PULSE identity, inline in the lane row) ---------- */
  .wk-athlete{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:#e8e8f0;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .parent.off .wk-athlete{color:var(--muted)}
  .child .wk-athlete{font-size:12px;font-weight:600;color:var(--muted)}

  .wk-rank{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
  .wk-rnum{font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:800;line-height:1}
  .r1{color:#f0c040}.r2{color:#a0b0c0}.r3{color:#c08050}.rn{color:#7a7aa0}
  .wk-dlt{font-size:8px;font-weight:700;letter-spacing:.04em}
  .up{color:#3ecf6a}.down{color:#f0603a}.same{color:#404060}

  .wk-mvt{display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0}
  .wk-mname{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:#e8e8f0;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wk-mdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 7px rgba(56,189,248,.7);animation:rx 1.4s infinite;margin-right:7px;vertical-align:middle}
  .wk-mprog{font-size:9px;font-weight:600;color:var(--muted);letter-spacing:.05em}
  .wk-mfin{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:#f0a030;letter-spacing:.06em}
  .wk-moff{font-size:10px;font-weight:600;color:var(--muted-2);letter-spacing:.1em;text-transform:uppercase}
  .wk-barw{display:flex;align-items:center;gap:8px}
  .wk-track{flex:1;height:6px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
  .wk-fill{height:100%;border-radius:99px;width:0;transition:width .6s ease}
  .wk-fill.active{background:var(--accent)} .wk-fill.fin{background:#f0a030;width:100%}
  .wk-pct{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;min-width:30px;text-align:right}
  .wk-pct.active{color:#5b8fd0} .wk-pct.fin{color:#b0852e}

  .wk-pace{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
  .wk-pv{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:var(--accent);line-height:1}
  .parent.off .wk-pv{color:var(--muted-2)}
  .wk-pl{font-size:7px;color:var(--muted-2);font-weight:600;letter-spacing:.08em;text-transform:uppercase}

  .wk-cum{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
  .wk-cv{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:#e8e8f0;line-height:1}
  .parent.off .wk-cv{color:var(--muted-2)}
  .wk-cl{font-size:7px;color:var(--muted-2);font-weight:600;letter-spacing:.08em;text-transform:uppercase}

  /* ---------- ACTION BAR + VERDICT BADGES + lighter scoring ---------- */
  .alertbar{margin:14px 0 0;border-radius:14px;border:1px solid var(--line);background:var(--panel);
    box-shadow:var(--shadow);padding:11px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .alertbar.ok{border-color:rgba(52,211,153,.4);background:linear-gradient(90deg,rgba(52,211,153,.10),transparent)}
  .alertbar.crit{border-color:rgba(248,85,107,.45);background:linear-gradient(90deg,rgba(248,85,107,.12),transparent)}
  .alertbar.warn{border-color:rgba(251,146,60,.4);background:linear-gradient(90deg,rgba(251,146,60,.10),transparent)}
  .ab-head{display:flex;align-items:center;gap:9px;flex-shrink:0;font-family:'Saira Condensed',sans-serif;
    font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
  .ab-head .cnt{font-size:11px;font-weight:600;letter-spacing:.06em}
  .ab-items{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ab-item{display:inline-flex;align-items:center;gap:7px;cursor:pointer;border:1px solid var(--line);
    background:rgba(255,255,255,.03);border-radius:8px;padding:5px 10px;font-size:11px;font-weight:500;
    color:var(--text);transition:border-color .15s,background .15s}
  .ab-item:hover{border-color:var(--accent);background:rgba(255,255,255,.07)}
  .ab-item b{font-family:'Saira Condensed',sans-serif;font-weight:700;letter-spacing:.05em}
  .ab-item .lv{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .ab-item .what{color:var(--muted)}
  .ab-ok{display:inline-flex;align-items:center;gap:9px;font-family:'Saira Condensed',sans-serif;
    font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ok)}

  /* verdict badge (replaces the colored dot before the athlete name) */
  .vbadge{display:inline-flex;align-items:center;font-family:'Saira Condensed',sans-serif;font-size:10px;
    font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:5px;
    line-height:1;flex-shrink:0;border:1px solid transparent}
  .vb-ok  {color:#2fd98a;background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.3)}
  .vb-live{color:#5bc8ff;background:rgba(56,189,248,.14);border-color:rgba(56,189,248,.32)}
  .vb-warn{color:#ffb061;background:rgba(251,146,60,.15);border-color:rgba(251,146,60,.34)}
  .vb-crit{color:#ff6b86;background:rgba(248,85,107,.16);border-color:rgba(248,85,107,.38)}
  .vb-off {color:#8b93a7;background:rgba(139,147,167,.14);border-color:rgba(139,147,167,.3)}
  .vb-fin {color:#f0c040;background:rgba(240,192,64,.14);border-color:rgba(240,192,64,.32)}
  .wk-athlete{display:flex;align-items:center;gap:9px}
  .wk-athlete .aname{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:#e8e8f0;
    letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .parent.off .wk-athlete .aname{color:var(--muted)}

  /* issue-only filter + missing/ok connectivity labels */
  .grid.issues .grp.is-ok{display:none}
  .ipstat{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.02em}
  .ipstat.ok{color:var(--muted)} .ipstat.bad{color:#ff6b86;font-weight:600}
  .rollcap2{display:block;font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);margin-top:2px}
  .dev-issue{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}

  /* lighter scoring weight (equipment should read louder than the leaderboard) */
  .wk-rnum{font-size:16px;font-weight:700}
  .wk-mname{font-size:13px;color:#c3c5d6}
  .wk-mdot{box-shadow:none;opacity:.8}
  .wk-pv{font-size:15px;font-weight:600;color:#6fa8d8}
  .wk-fill.active{background:#3f7fb8}
  .wk-track{background:rgba(255,255,255,.06)}

  /* device-composition strip (parent rows) */
  .ricon{display:inline-flex;align-items:center;justify-content:center}
  .ricon svg{width:100%;height:auto;display:block}
  .devstrip{display:flex;align-items:center;gap:6px}
  .dchip{display:inline-flex;align-items:center;justify-content:center;width:26px;height:24px;border-radius:6px;
    font-size:11px;line-height:1;border:1px solid transparent}
  .dchip.ok  {color:#2fd98a;background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.28)}
  .dchip.warn{color:#ffb061;background:rgba(251,146,60,.13);border-color:rgba(251,146,60,.3)}
  .dchip.crit{color:#ff6b86;background:rgba(248,85,107,.14);border-color:rgba(248,85,107,.34)}
  .dchip.missing{color:#ff6b86;background:transparent;border:1px dashed rgba(248,85,107,.55);position:relative}
  .dchip.missing::after{content:'';position:absolute;left:2px;right:2px;top:50%;height:1.5px;background:#ff6b86;transform:rotate(-32deg)}

  /* child device: equipment aligned under parent cols 2-4, role detail in athlete col 5 */
  .child .lane{grid-column:1}
  .child .batt{grid-column:2}
  .child .sig{grid-column:3}
  .child .ip{grid-column:4;font-size:11px}
  .child .cspan{grid-column:5 / 10;display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0}
  .child .cspan .code{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--text)}
  .child .cspan .crole{display:inline-flex;align-items:center;gap:6px}
  .child .cspan .repcell .rep{font-size:16px}
  .child .cip{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)}
</style>

       {role:'echo',    battery:null, dbm:-60, ip:'10.0.1.42', link:'LANE2-ECH', type:'wifi'} ]},
    {lane:3,  expected:['counter','buzzer'], name:'ALEXANDER', devices:[
       {role:'counter', battery:24, dbm:-68, ip:'10.0.1.23', link:'LANE3-CNT', type:'mobile', rep:137},
       {role:'buzzer',  battery:88, dbm:-61, ip:'10.0.1.33', link:'LANE3-BZR', type:'mobile', finish:'02:09.7'} ]},
    {lane:4,  expected:['counter'], name:'WILLIAM', devices:[
       {role:'counter', battery:76, dbm:-55, ip:'10.0.1.24', link:'LANE4-CNT', type:'wifi',   rep:131} ]},
    {lane:5,  expected:['counter','buzzer'], name:'BRILEY', devices:[
       {role:'counter', battery:61, dbm:-54, ip:'10.0.1.25', link:'LANE5-CNT', type:'wifi',   rep:138},
       {role:'buzzer',  battery:80, dbm:-57, ip:'10.0.1.35', link:'LANE5-BZR', type:'wifi',   finish:null} ]},
    {lane:6,  expected:['counter','buzzer'], name:'ZACHARY', devices:[
       {role:'counter', battery:55, dbm:-78, ip:'10.0.1.26', link:'LANE6-CNT', type:'mobile', charging:true, rep:142},
       {role:'buzzer',  battery:70, dbm:-88, ip:'10.0.1.36', link:'LANE6-BZR', type:'mobile', finish:null} ]},
    {lane:7,  expected:['counter','buzzer','echo'], name:'GRANT', devices:[
       {role:'counter', battery:91, dbm:null, ip:'10.0.1.27', link:'LANE7-CNT', type:'eth',   rep:139},
       {role:'buzzer',  battery:94, dbm:null, ip:'10.0.1.37', link:'LANE7-BZR', type:'eth',   finish:null},
       {role:'echo',    battery:null, dbm:-57, ip:'10.0.1.47', link:'LANE7-ECH', type:'wifi'} ]},
    {lane:8,  expected:['counter','buzzer','echo'], name:'LEONARDO', devices:[
       {role:'counter', battery:18, dbm:-67, ip:'10.0.1.28', link:'LANE8-CNT', type:'mobile', rep:140},
       {role:'buzzer',  battery:85, dbm:-62, ip:'10.0.1.38', link:'LANE8-BZR', type:'mobile', finish:null} ]},   // echo expected but missing
    {lane:9,  expected:['counter','buzzer'], name:'SELVAN', devices:[
       {role:'counter', battery:69, dbm:-52, ip:'10.0.1.29', link:'LANE9-CNT', type:'wifi',   rep:140},
       {role:'buzzer',  battery:77, dbm:-55, ip:'10.0.1.39', link:'LANE9-BZR', type:'wifi',   finish:null} ]},
    {lane:10, expected:['counter','buzzer'], name:'TY', devices:[]},                                   // offline
  ];
  const PREOPEN = [2,6]; // start expanded so both views are visible

  // ===== workout state, merged onto the same lanes (single source of truth) =====
  const WK = {
    2:{status:'fin', finish:118.4, repmin:112, mi:8},                                  // NICK — finished
    3:{status:'fin', finish:129.7, repmin:104, mi:8},                                  // ALEXANDER — finished
    4:{status:'run', mvt:'TB Cal Row',        done:24, total:40, mi:5, repmin:88},     // WILLIAM
    5:{status:'run', mvt:'Burpees To Target', done:38, total:50, mi:4, repmin:80},     // BRILEY
    6:{status:'run', mvt:'Cal Row',           done:31, total:40, mi:3, repmin:76},     // ZACHARY
    7:{status:'run', mvt:'TB Cal Row',        done:17, total:40, mi:5, repmin:84},     // GRANT
    8:{status:'run', mvt:'Burpees To Target', done:44, total:50, mi:4, repmin:90},     // LEONARDO
    9:{status:'run', mvt:'DBall Squat',       done:12, total:50, mi:2, repmin:70},     // SELVAN
  };
  lanes.forEach(L=>{ L.wk = WK[L.lane] ? Object.assign({rank:0,prev:0}, WK[L.lane]) : null; });

  const fmtT = s => { const mm=Math.floor(s/60), ss=Math.floor(s%60), t=Math.floor((s*10)%10),
    p=n=>String(n).padStart(2,'0'); return `${p(mm)}:${p(ss)}.${t}`; };
  const rankClass = r => r===1?'r1':r===2?'r2':r===3?'r3':'rn';
  const score = w => w.status==='fin' ? Infinity : (w.mi + w.done/w.total);
  function computeRanks(){
    const ws = lanes.filter(L=>L.wk).map(L=>L.wk);
    const fin = ws.filter(w=>w.status==='fin').sort((a,b)=>a.finish-b.finish);
    const run = ws.filter(w=>w.status==='run').sort((a,b)=>score(b)-score(a));
    let r=1; [...fin,...run].forEach(w=>{ w.prev=w.rank||r; w.rank=r++; });
  }
  computeRanks();

  // ===== helpers =====
  const battColor = p => p>=70 ? 'var(--ok)' : p>=30 ? 'var(--orange)' : 'var(--bad)'; // <30 red · 30-69 orange · 70+ green
  function sig(dbm){
    if(dbm >= -60) return {tier:4, label:'Excellent', color:'var(--ok)'};
    if(dbm >= -70) return {tier:3, label:'Good',      color:'var(--good)'};
    if(dbm >= -85) return {tier:2, label:'Fair',      color:'var(--warn)'};
    return            {tier:1, label:'Poor',      color:'var(--bad)'};
  }
  function barsHTML(t,c){const h=[7,10,13,16];
    return '<span class="bars">'+[1,2,3,4].map(i=>`<span class="b" style="height:${h[i-1]}px;background:${i<=t?c:'rgba(255,255,255,.13)'}"></span>`).join('')+'</span>';}
  function devHealth(d){ const b=d.battery!=null;
    if((b&&d.battery<20)||(d.dbm!==null&&d.dbm<-85)) return 'crit';
    if((b&&d.battery<30)||(d.dbm!==null&&d.dbm<-70)) return 'warn'; return 'ok'; }
  const HC = {ok:'var(--ok)', warn:'var(--orange)', crit:'var(--bad)', off:'var(--bad)'};
  // expected-equipment filter: operator ticks which device types are on the floor
  const ACTIVE = new Set(ROLE_ORDER);
  const expRoles  = L => (L.expected||[]).filter(r=>ACTIVE.has(r));
  const activeDevs= L => L.devices.filter(d=>ACTIVE.has(d.role));

  function laneHealth(L){ const devs=activeDevs(L); if(!devs.length) return 'off';
    let r='ok'; devs.forEach(d=>{const h=devHealth(d); if(h==='crit')r='crit'; else if(h==='warn'&&r==='ok')r='warn';}); return r; }

  const roleShort = r => ROLE[r] ? ROLE[r].label : r;
  const missingRoles = L => expRoles(L).filter(r=>!L.devices.some(d=>d.role===r));
  // human-readable reason for a problematic device
  function devIssue(d){
    if(d.battery!=null && d.battery<20) return {lvl:'crit', txt:`battery ${d.battery}%`};
    if(d.dbm!==null && d.dbm<-85) return {lvl:'crit', txt:`signal poor (${d.dbm} dBm)`};
    if(d.battery!=null && d.battery<30) return {lvl:'warn', txt:`battery ${d.battery}%`};
    if(d.dbm!==null && d.dbm<-70) return {lvl:'warn', txt:`signal weak (${d.dbm} dBm)`};
    return null;
  }
  // lane verdict badge: OFFLINE / PARTIAL / ISSUE / LIVE / FINISHED / READY
  function laneVerdict(L){
    const devs=activeDevs(L);
    if(expRoles(L).length && devs.length===0) return {label:'OFFLINE', cls:'vb-off', lvl:'crit'};
    if(missingRoles(L).length) return {label:'PARTIAL', cls:'vb-crit', lvl:'crit'};
    if(devs.length){
      const hp=laneHealth(L);
      if(hp==='crit') return {label:'ISSUE', cls:'vb-crit', lvl:'crit'};
      if(hp==='warn') return {label:'ISSUE', cls:'vb-warn', lvl:'warn'};
    }
    if(L.wk && L.wk.status==='fin') return {label:'FINISHED', cls:'vb-fin', lvl:'ok'};
    if(L.wk && L.wk.status==='run') return {label:'LIVE', cls:'vb-live', lvl:'ok'};
    return {label:'READY', cls:'vb-ok', lvl:'ok'};
  }

  // device-composition strip: one glyph per expected role, coloured by health, struck if missing
  function devStripHTML(L){
    const exp = expRoles(L).length ? expRoles(L) : activeDevs(L).map(d=>d.role);
    const cells = ROLE_ORDER.filter(r=>exp.includes(r)).map(r=>{
      const d = L.devices.find(x=>x.role===r);
      if(!d) return `<span class="dchip missing" title="${ROLE[r].label} — MISSING">${roleIcon(r,15)}</span>`;
      const h = devHealth(d);
      return `<span class="dchip ${h}" title="${ROLE[r].label} — ${h==='ok'?'OK':h==='warn'?'warning':'critical'}">${roleIcon(r,15)}</span>`;
    }).join('');
    return `<div class="devstrip">${cells}</div>`;
  }

  // SVG battery glyph — fill level + colour encode the level, integrated bolt = charging
  // vertical battery glyph — stacked segments encode level; bolt sits BESIDE the battery in a fixed slot
  function battIconSVG(pct){
    const col = battColor(pct);
    const off = 'rgba(255,255,255,.10)';
    const seg = [ {y:16.2, on:pct>0}, {y:12.2, on:pct>=25}, {y:8.2, on:pct>=50}, {y:4.2, on:pct>=75} ];
    const fills = seg.map(s=>`<rect x="4" y="${s.y}" width="6" height="3.1" rx="0.9" fill="${s.on?col:off}"/>`).join('');
    return `<svg class="bicon-v" viewBox="0 0 14 22" fill="none" aria-hidden="true">`
      +`<rect x="4.6" y="0.4" width="4.8" height="1.7" rx="0.7" fill="${col}"/>`
      +`<rect x="2" y="2.6" width="10" height="18.4" rx="2" fill="none" stroke="${col}" stroke-width="1.5"/>`
      +fills+`</svg>`;
  }
  const BOLT_SVG = `<svg viewBox="0 0 12 20" aria-hidden="true"><path d="M7.4 1 L1.6 11 H5.4 L4 19 L10.4 8.2 H6.4 Z" fill="var(--accent)"/></svg>`;
  const PLUG_SVG = `<svg class="bicon-v" viewBox="0 0 14 22" fill="none" stroke="var(--ok)" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
    <line x1="4.6" y1="2" x2="4.6" y2="6"/><line x1="9.4" y1="2" x2="9.4" y2="6"/>
    <path d="M3 6 H11 V10 A4 4 0 0 1 7 14 A4 4 0 0 1 3 10 Z" fill="rgba(52,211,153,.13)"/>
    <line x1="7" y1="14" x2="7" y2="19"/></svg>`;

  function battHTML(d, rollRole, showPct){
    const cap = rollRole ? `<span class="rollcap2">lowest: ${rollRole}</span>` : '';
    if(d.battery===null||d.battery===undefined)
      return `<div class="batt" title="Mains powered">${PLUG_SVG}<span class="bslot"></span>${showPct?'<span class="pct">AC</span>':''}${cap}</div>`;
    const pct = showPct ? `<span class="pct">${d.battery}%</span>` : '';
    const bolt = `<span class="bslot">${d.charging?BOLT_SVG:''}</span>`;
    return `<div class="batt" title="Battery ${d.battery}%${d.charging?' (charging)':''}">${battIconSVG(d.battery)}${bolt}${pct}${cap}</div>`;
  }
  function sigHTML(d,roll){const s=sig(d.dbm);
    return `<div class="sig">${barsHTML(s.tier,s.color)}<div class="val">`
      +`<span class="dbm" style="color:${s.color}">${d.dbm}<small>dBm</small></span>`
      +`<span class="tier" style="color:${s.color}">${s.label}${roll?' · weakest':''}</span></div></div>`;
  }
  // single combined glyph: SHAPE = connection type, FILL/COLOR = strength
  function signalIconHTML(d){
    const s=sig(d.dbm), on=s.color, off='rgba(255,255,255,.16)';
    if(d.type==='eth'){ // wired RJ45 — always a solid link, drawn green
      const g='var(--ok)';
      return `<svg class="sigico" viewBox="0 0 24 20" fill="none" stroke="${g}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">`
        +`<rect x="4" y="6" width="16" height="11" rx="1.5"/><path d="M9 6V3h6v3"/>`
        +`<line x1="8" y1="10" x2="8" y2="13"/><line x1="12" y1="10" x2="12" y2="13"/><line x1="16" y1="10" x2="16" y2="13"/></svg>`;
    }
    if(d.type==='wifi'){
      const a3=s.tier>=4?on:off, a2=s.tier>=3?on:off, a1=s.tier>=2?on:off;
      return `<svg class="sigico" viewBox="0 0 24 22" fill="none" stroke-linecap="round" stroke-width="2.4">`
        +`<path d="M3 8a14 14 0 0 1 18 0" stroke="${a3}"/>`
        +`<path d="M6.3 11.8a9.2 9.2 0 0 1 11.4 0" stroke="${a2}"/>`
        +`<path d="M9.4 15.4a4.6 4.6 0 0 1 5.2 0" stroke="${a1}"/>`
        +`<circle cx="12" cy="18.8" r="1.5" fill="${on}" stroke="none"/></svg>`;
    }
    const h=[6,9,12,15];
    const bars=[1,2,3,4].map(i=>`<rect x="${(i-1)*5.4+1}" y="${17-h[i-1]}" width="3.6" height="${h[i-1]}" rx="1" fill="${i<=s.tier?on:off}"/>`).join('');
    return `<svg class="sigico" viewBox="0 0 23 18">${bars}</svg>`;
  }

  function sigConnHTML(d, rollRole, showText){
    const cap = rollRole ? `<span class="rollcap2">weakest: ${rollRole}</span>` : '';
    if(!showText){
      const lbl = d.type==='eth' ? 'LAN' : (d.type==='wifi' ? 'Wi-Fi' : 'LTE');
      const tt = d.type==='eth' ? 'Wired · 1 Gb' : `${d.dbm} dBm · ${sig(d.dbm).label}`;
      return `<div class="sig" title="${lbl} · ${tt}">${signalIconHTML(d)}${cap}</div>`;
    }
    if(d.type==='eth')
      return `<div class="sig">${signalIconHTML(d)}<div class="val">`
        +`<span class="dbm" style="color:var(--ok)">LAN</span>`
        +`<span class="tier" style="color:var(--ok)">Wired \u00b7 1 Gb</span>`
        +cap+`</div></div>`;
    const s=sig(d.dbm);
    return `<div class="sig">${signalIconHTML(d)}<div class="val">`
      +`<span class="dbm" style="color:${s.color}">${d.dbm}<small>dBm</small></span>`
      +`<span class="tier" style="color:${s.color}">${s.label}</span>`
      +cap+`</div></div>`;
  }

  // ----- workout cell builders (PULSE look, lane-level) -----
  function rankInner(w){
    if(!w) return `<div class="wk-rnum rn">\u2014</div>`;
    const d=w.prev-w.rank;
    const dlt = w.status==='fin' ? `<span class="wk-dlt same">\u2014</span>`
      : d>0 ? `<span class="wk-dlt up">\u25B2 ${d}</span>`
      : d<0 ? `<span class="wk-dlt down">\u25BC ${-d}</span>`
      : `<span class="wk-dlt same">\u2014</span>`;
    return `<div class="wk-rnum ${rankClass(w.rank)}">${w.rank}</div>${dlt}`;
  }
  function rankCell(w){ const ln=w?w._lane:''; return `<div class="wk-rank" data-lane="${ln}">${rankInner(w)}</div>`; }
  function mvtCell(w,elapsed){
    if(!w) return `<div class="wk-mvt"><div class="wk-moff">No live data</div></div>`;
    if(w.status==='fin')
      return `<div class="wk-mvt"><div class="wk-mfin">\u2691 Finished &nbsp;${fmtT(w.finish)}</div>`
        +`<div class="wk-barw"><div class="wk-track"><div class="wk-fill fin"></div></div><div class="wk-pct fin">100%</div></div></div>`;
    const pct=Math.min(100,Math.round(w.done/w.total*100));
    return `<div class="wk-mvt"><div class="wk-mname"><span class="wk-mdot"></span>${w.mvt}</div>`
      +`<div class="wk-mprog" data-lane="${w._lane}">${w.done} / ${w.total} reps &nbsp;\u00b7&nbsp; ${elapsed}</div>`
      +`<div class="wk-barw"><div class="wk-track"><div class="wk-fill active" data-lane="${w._lane}" style="width:${pct}%"></div></div>`
      +`<div class="wk-pct active" data-lane="${w._lane}">${pct}%</div></div></div>`;
  }
  function paceCell(w){
    if(!w) return `<div class="wk-pace"><div class="wk-pv">\u2014</div><div class="wk-pl">rep/min</div></div>`;
    return `<div class="wk-pace"><div class="wk-pv">${w.repmin}</div><div class="wk-pl">rep/min</div></div>`;
  }
  function cumulCell(L){ const w=L?L.wk:null;
    if(!w) return `<div class="wk-cum"><div class="wk-cv">\u2014</div><div class="wk-cl">Offline</div></div>`;
    if(w.status==='fin'){ const col=w.rank===1?'#f0c040':'#a0b0c0';
      return `<div class="wk-cum"><div class="wk-cv" style="color:${col}">${fmtT(w.finish)}</div><div class="wk-cl">Finished</div></div>`; }
    const c=L.devices.find(d=>d.role==='counter'); const reps=c?c.rep:w.done;
    return `<div class="wk-cum"><div class="wk-cv" style="color:var(--ok)" data-lane="${w._lane}">${reps}</div><div class="wk-cl">Reps</div></div>`;
  }
  // device-level info shown in the expanded child row (link + its own activity)
  function childExtraHTML(d){
    const R=ROLE[d.role];
    const code=`<span class="code">${d.link}</span>`;
    const iss=devIssue(d);
    const issTag = iss ? `<span class="dev-issue" style="color:${iss.lvl==='crit'?'#ff6b86':'#ffb061'}">\u26A0 ${iss.txt}</span>` : '';
    const role=`<span class="crole" style="color:${R.color}">${roleIcon(d.role,15)} ${R.label}</span>`;
    if(d.role==='counter')
      return `<div class="cspan">${role}${code}`
        +`<div class="repcell"><span class="rdot"></span><span class="arrow">\u25B2</span><span class="rep" data-lane="${d._lane}">${d.rep}</span></div>${issTag}</div>`;
    if(d.role==='buzzer'){
      const act = d.finish ? `<div class="fcell done"><span class="flag">\uD83C\uDFC1</span>FINISH ${d.finish}</div>`
                           : `<div class="fcell armed"><span class="fdot"></span>ARMED</div>`;
      return `<div class="cspan">${role}${code}${act}${issTag}</div>`;
    }
    // echo screen — mirrors the lane workout info
    return `<div class="cspan">${role}${code}<div class="fcell done" style="color:#c4b5fd;border-color:rgba(196,181,253,.3)">DISPLAYING</div>${issTag}</div>`;
  }

  // ===== render =====
  function render(){
    const elapsed = fmtT(wk);
    document.getElementById('rows').innerHTML = lanes.map(L=>{
      L.devices.forEach(d=>d._lane=L.lane);
      if(L.wk) L.wk._lane=L.lane;
      const hp = laneHealth(L);
      const devs = activeDevs(L);
      // ----- OFFLINE / empty lane (no active devices) -----
      if(!devs.length){
        const vd0=laneVerdict(L);
        return `<div class="grp is-${vd0.lvl}"><div class="row parent off">
          <div class="lane"><span class="chev" style="visibility:hidden">\u25B6</span>
            <div class="no">${L.lane}</div><span class="vbadge ${vd0.cls}">${vd0.label}</span></div>
          <div><span class="na">\u2014</span></div>
          <div class="sig"><span class="na">\u2014</span></div>
          <div class="ip">${devStripHTML(L)}</div>
          <div class="wk-athlete"><span class="aname">${L.name}</span></div>
          ${rankCell(L.wk)}
          ${mvtCell(L.wk,elapsed)}
          ${paceCell(L.wk)}
          ${cumulCell(L)}
        </div></div>`;
      }
      // ----- worst-case equipment rollups -----
      const battDevs = devs.filter(d=>d.battery!=null);
      const worstB = battDevs.length ? battDevs.reduce((a,b)=>b.battery<a.battery?b:a) : {battery:null};
      const worstS = devs.reduce((a,b)=>(b.dbm??0)<(a.dbm??0)?b:a);
      const vd=laneVerdict(L);
      
      const parent = `<div class="row parent ${hp}">
        <div class="lane"><span class="chev">\u25B6</span><div class="no">${L.lane}</div><span class="vbadge ${vd.cls}">${vd.label}</span></div>
        ${battHTML(worstB, worstB.battery!==null&&worstB.battery<30?roleShort(worstB.role):null, false)}
        ${sigConnHTML(worstS, (worstS.dbm!==null&&worstS.dbm<-70)?roleShort(worstS.role):null, false)}
        <div class="ip">${devStripHTML(L)}</div>
        <div class="wk-athlete"><span class="aname">${L.name}</span></div>
        ${rankCell(L.wk)}
        ${mvtCell(L.wk,elapsed)}
        ${paceCell(L.wk)}
        ${cumulCell(L)}
      </div>`;
      // ----- child device rows (equipment detail, expandable) -----
      const kids = devs.map(d=>{
        const h=devHealth(d); const R=ROLE[d.role];
        return `<div class="row child">
          <div class="lane dev"><span class="dline"></span>
            <span class="dicon" style="color:${R.color}">${roleIcon(d.role,16)}</span>
            <span class="dot" style="background:${HC[h]};margin-left:2px"></span></div>
          ${battHTML(d,null,true)}
          ${sigConnHTML(d,null,true)}
          <div class="ip">${d.ip}</div>
          ${childExtraHTML(d)}
        </div>`;
      }).join('');
      const open = PREOPEN.includes(L.lane) ? ' open' : '';
      return `<div class="grp is-${vd.lvl}${open}">${parent}<div class="kids">${kids}</div></div>`;
    }).join('');

    // expand / collapse interactions
    document.querySelectorAll('.row.parent:not(.off)').forEach(p=>{
      p.addEventListener('click', ()=> p.closest('.grp').classList.toggle('open'));
    });
  }
  // clock state (declared before render so the workout cells can show elapsed)
  let tod=18*3600+13*60+18, wk=3*60+12; const cap=20*60;
  render();
  renderAlerts();

  // ===== action / alert bar =====
  function collectAlerts(){
    const items=[];
    lanes.forEach(L=>{
      const exp=expRoles(L), devs=activeDevs(L);
      if(exp.length && devs.length===0){ items.push({lvl:'crit', lane:L.lane, what:'awaiting devices', detail:`0/${exp.length} connected`}); return; }
      missingRoles(L).forEach(r=> items.push({lvl:'crit', lane:L.lane, what:roleShort(r), detail:'missing'}));
      devs.forEach(d=>{ const iss=devIssue(d); if(iss) items.push({lvl:iss.lvl, lane:L.lane, what:roleShort(d.role), detail:iss.txt}); });
    });
    // critical first
    items.sort((a,b)=> (a.lvl===b.lvl)?0 : a.lvl==='crit'?-1:1);
    return items;
  }
  function renderAlerts(){
    const bar=document.getElementById('alertbar');
    const items=collectAlerts();
    const crit=items.filter(i=>i.lvl==='crit').length, warn=items.filter(i=>i.lvl==='warn').length;
    if(!items.length){
      bar.className='alertbar ok';
      bar.innerHTML=`<div class="ab-ok"><span class="lv" style="width:9px;height:9px;border-radius:50%;background:var(--ok)"></span>All systems OK \u00b7 nothing to action</div>`;
      return;
    }
    bar.className='alertbar '+(crit?'crit':'warn');
    const head=`<div class="ab-head">\u26A0 Action required
      <span class="cnt" style="color:#ff6b86">${crit} critical</span>
      ${warn?`<span class="cnt" style="color:#ffb061">\u00b7 ${warn} warning</span>`:''}</div>`;
    const chips=items.map(i=>{
      const col=i.lvl==='crit'?'#ff6b86':'#ffb061';
      return `<button class="ab-item" data-lane="${i.lane}"><span class="lv" style="background:${col}"></span>`
        +`<b>Lane ${i.lane}</b> <span class="what">${i.what} \u00b7 ${i.detail}</span></button>`;
    }).join('');
    bar.innerHTML=head+`<div class="ab-items">${chips}</div>`;
    bar.querySelectorAll('.ab-item').forEach(b=>b.addEventListener('click',()=>focusLane(+b.dataset.lane)));
  }
  function focusLane(n){
    const grps=document.querySelectorAll('#rows .grp');
    const idx=lanes.findIndex(L=>L.lane===n); if(idx<0) return;
    const g=grps[idx]; if(!g) return;
    if(g.querySelector('.kids')) g.classList.add('open');
    g.scrollIntoView({behavior:'smooth', block:'center'});
    const row=g.querySelector('.row.parent');
    row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash');
  }

  // expand all / collapse all
  let allOpen=false;
  document.getElementById('toggleAll').addEventListener('click', e=>{
    allOpen=!allOpen;
    document.querySelectorAll('.grp').forEach(g=>{ if(g.querySelector('.kids')) g.classList.toggle('open', allOpen); });
    e.target.textContent = allOpen ? 'Collapse all' : 'Expand all';
  });

  // show issues only (critical + warning)
  let issuesOnly=false;
  document.getElementById('issuesOnly').addEventListener('click', e=>{
    issuesOnly=!issuesOnly;
    document.querySelector('section.grid').classList.toggle('issues', issuesOnly);
    e.target.classList.toggle('on', issuesOnly);
    e.target.textContent = issuesOnly ? 'Show all lanes' : 'Show issues only';
  });

  // ===== connection counter (re-runs when the equipment filter changes) =====
  function renderHeaderCounts(){
    const totalLanes=10;
    const live=lanes.filter(L=>activeDevs(L).length).length;
    let on=0,exp=0; lanes.forEach(L=>{on+=activeDevs(L).length; exp+=expRoles(L).length||activeDevs(L).length;});
    document.getElementById('connNum').textContent=live;
    document.querySelector('.tot').textContent='/'+totalLanes;
    document.getElementById('devsum').textContent=on+'/'+exp+' devices';
    const c=2*Math.PI*19, a=document.getElementById('ringArc');
    a.setAttribute('stroke-dasharray',c.toFixed(1));
    a.setAttribute('stroke-dashoffset',(c*(1-live/totalLanes)).toFixed(1));
    document.getElementById('counter').classList.toggle('ok', live===totalLanes);
  }
  renderHeaderCounts();

  // ===== expected-equipment dropdown =====
  (function(){
    const menu=document.getElementById('eqMenu'), btn=document.getElementById('eqBtn'), cnt=document.getElementById('eqCount');
    ROLE_ORDER.forEach(r=>{
      const b=document.createElement('button');
      b.className='eqitem on'; b.dataset.role=r;
      b.innerHTML=`<span class="tick">\u2713</span>${roleIcon(r,17)}${ROLE[r].label}`;
      b.addEventListener('click',e=>{
        e.stopPropagation();
        if(ACTIVE.has(r)){ if(ACTIVE.size===1) return; ACTIVE.delete(r); b.classList.remove('on'); }
        else { ACTIVE.add(r); b.classList.add('on'); }
        cnt.textContent=ACTIVE.size+'/'+ROLE_ORDER.length;
        render(); renderAlerts(); renderHeaderCounts(); refreshWorkout();
      });
      menu.appendChild(b);
    });
    btn.addEventListener('click',e=>{ e.stopPropagation(); menu.classList.toggle('open'); });
    document.addEventListener('click',()=>menu.classList.remove('open'));
  })();

  // ===== clocks =====
  // ===== clocks (state declared earlier so render() can read wk) =====
  const fmt=(s,h=false)=>{const hh=Math.floor(s/3600),mm=Math.floor((s%3600)/60),ss=s%60,p=n=>String(n).padStart(2,'0');
    return h?`${p(hh)}:${p(mm)}:${p(ss)}`:`${p(mm)}:${p(ss)}`;};
  function tick(){
    tod++; if(tod>=86400)tod=0;
    document.getElementById('timeOfDay').textContent=fmt(tod,true);
    document.getElementById('lastUpd').textContent=fmt(tod,true);
    if(wk<cap)wk++;
    const wc=document.getElementById('workoutClock'); wc.textContent=fmt(wk); wc.className='';
    const left=cap-wk; if(left<=10)wc.classList.add('bad'); else if(left<=60)wc.classList.add('warn');
  }
  setInterval(tick,1000); tick();

  // ===== workout live refresh (rank, movement progress, cumulative) =====
  function refreshWorkout(){
    computeRanks();
    const elapsed = fmtT(wk + (Date.now()%1000)/1000);
    lanes.forEach(L=>{
      const w=L.wk; if(!w) return;
      // rank + delta (row order stays fixed by lane)
      const rk=document.querySelector('.wk-rank[data-lane="'+L.lane+'"]');
      if(rk) rk.innerHTML=rankInner(w);
      if(w.status==='run'){
        const pct=Math.min(100,Math.round(w.done/w.total*100));
        const prog=document.querySelector('.wk-mprog[data-lane="'+L.lane+'"]');
        if(prog) prog.innerHTML=`${w.done} / ${w.total} reps &nbsp;\u00b7&nbsp; ${elapsed}`;
        const fill=document.querySelector('.wk-fill[data-lane="'+L.lane+'"]');
        if(fill) fill.style.width=pct+'%';
        const pl=document.querySelector('.wk-pct[data-lane="'+L.lane+'"]');
        if(pl) pl.textContent=pct+'%';
        const cv=document.querySelector('.wk-cv[data-lane="'+L.lane+'"]');
        const c=L.devices.find(d=>d.role==='counter');
        if(cv && c) cv.textContent=c.rep;
      }
    });
  }

  // ===== live feed: device rep stream + workout movement progress =====
  setInterval(()=>{
    lanes.forEach(L=>{
      const c=L.devices.find(d=>d.role==='counter');
      if(c && Math.random()<0.55){
        c.rep++;
        document.querySelectorAll('.rep[data-lane="'+L.lane+'"]').forEach(el=>{
          el.textContent=c.rep;
          const cell=el.closest('.repcell');
          cell.classList.remove('flash'); void cell.offsetWidth; cell.classList.add('flash');
        });
      }
      // advance the current movement for running athletes
      const w=L.wk;
      if(w && w.status==='run' && Math.random()<0.5){
        w.done++;
        if(w.done>=w.total){ w.mi++; w.done=0; w.total=40+Math.floor(Math.random()*11); }
      }
    });
    refreshWorkout();
  },1500);

  // keep running cumulative flowing with the workout clock
  setInterval(refreshWorkout,1000);
</script>
</body>
</html>
