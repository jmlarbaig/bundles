<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <!-- JQUERY -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>

    <!-- Bootstrap avec version plus récente -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Font Awesome pour icônes modernes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" type="text/css" href="./js/svg/jquery.svg.css">
    <script type="text/javascript" src="./js/svg/jquery.svg.js"></script>
    <!-- Human Parser -->
    <script src="https://cdn.jsdelivr.net/npm/humanparser@2.7.0/index.min.js"></script>

    <title>Overlay Side</title>
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon.png">


    <!-- local CSS -->
    <link rel="stylesheet" href="../common/css/index.css">
    <link rel="stylesheet" href="../common/css/video.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/overlay.css">
    <link rel="stylesheet" href="css/colors.css">


    <!-- local Assets -->
    <script src="../assets/flag.js" type="text/javascript"></script>

    <!-- local Javascript -->
    <script src="./js/html-elements.js" type="text/javascript"></script>
    <script src="./js/effect.js" type="text/javascript"></script>
    <script src="./js/status.js" type="text/javascript"></script>

    <script src="../common/js/dynamic.js" type="text/javascript"></script>
    <script src="../common/js/static.js" type="text/javascript"></script>
    <script src="../common/js/tools.js" type="text/javascript"></script>
    <script src="../common/js/time.js" type="text/javascript"></script>

</head>

<body class="screen">
    <div class="backgroundOverlay">

    </div>

    <div class="flex-container">
        <div class="flex-item video-content">
            <video id="video" autoplay muted>
                <source id="sourceVid" src="" type="video/mp4">
            </video>
        </div>
    </div>

    <div class="header">
        <div class="box_logo" style="display: none;">
            <div id="logo" class="logo"></div>
        </div>

        <div class="box_chrono" style="display: none;">
            <div id="chrono" class="chrono"></div>
        </div>

        <div class="box_heat" style="display: none;">
            <div id="heat" class="heat"></div>
        </div>
        <div class="repTar text-nowrap text-truncate" style="display: none;"></div>
    </div>


    <div class="leaderboards" id="leaderboards" style="display: none;"></div>

    <div class="frame" id="frame"></div>

    <div class="sponsorLogo" id="sponsorLogo"></div>

    <div class="mainSponsor"></div>


    <script src="../index.js" type="text/javascript"></script>
</body>

</html>
